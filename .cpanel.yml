---
deployment:
  tasks:
    - export REPO_DIR=/home/muarati1/pharm-inventory-app
    - export DEPLOY_DIR=/home/muarati1/public_html
    
    # 1. Install dependencies di folder repo
    - cd $REPO_DIR && /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader
    
    # 2. Jalankan artisan commands (migrasi & clear cache) di folder repo
    - cd $REPO_DIR && php artisan migrate --force
    - cd $REPO_DIR && php artisan optimize:clear
    
    # 3. Copy HANYA isi folder public ke public_html (Best Practice keamanan Laravel)
    - /bin/cp -R $REPO_DIR/public/* $DEPLOY_DIR/
    
    # 4. Modifikasi index.php di public_html agar mengarah ke folder repo yang aman
    - sed -i "s|__DIR__.'/../|__DIR__.'/../pharm-inventory-app/|g" $DEPLOY_DIR/index.php
    
    # 5. Buat ulang storage symlink di public_html (wajib untuk file upload Laravel)
    - rm -rf $DEPLOY_DIR/storage
    - ln -s $REPO_DIR/storage/app/public $DEPLOY_DIR/storage
